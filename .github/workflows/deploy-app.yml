name: Deploy Concept Clustering App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact (only web-concept-clustering/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-concept-clustering/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
